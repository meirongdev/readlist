# readlist —— oracle-k3s 生产清单【参照件】
#
# ⚠️ 部署清单的唯一真相源在 homelab 仓库
# (`cloud/oracle/manifests/personal-services/readlist.yaml`),ArgoCD 只指向那里。
# 本文件是**照着这套形状抄过去**用的参照,集群实际部署的不是它。
#
# 抄过去时必须一并做的三件事(漏一件就静默不生效或被 CI 拦下):
#   1. 在 `cloud/oracle/manifests/personal-services/kustomization.yaml` 的
#      `resources:` 里**登记**本文件 —— oracle 侧是显式 kustomize 树;
#   2. 把 `readlist-data` 加进 oracle 夜备脚本的 sqlite 列表 —— CI 规则 H4 会拦下
#      没有备份归属的 PVC;
#   3. 把 image 换成 CI 推出来的**版本化 tag 或 digest** —— Kyverno 禁 `latest`。
#
# 命名空间 `personal-services` 由 homelab 侧管理,这里不创建。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readlist-config
  namespace: personal-services
data:
  DB_PATH: /data/readlist.db
  API_LISTEN_ADDR: ":8080"
  STANDARD_VERSION: "1.0"
  # 保留的历史 run 数(回滚窗口)。每夜一个 run ≈ 1.5 万行,不回收会写满 PVC。
  KEEP_RUNS: "5"
  # 阅读轨迹默认公开(NFR-15 说明了理由);改 "false" 即刻转私有。
  EXPOSE_READ_STATUS: "true"
  # snapshot 命令的输入:calibre 的两个源库(只有 snapshot CronJob 挂这两个卷)。
  SOURCE_METADATA_DB: /library-src/metadata.db
  SOURCE_APP_DB: /config-src/app.db
  SNAPSHOT_DIR: /data/snapshot
  CALIBRE_USER_ID: "1"
  # ingest 每次运行的外部请求预算。打满就干净停下,次日接着跑(NFR-9)。
  # 首轮全量约需 1,000–1,500 次请求 → 分 2–3 晚跑完。
  INGEST_BUDGET: "800"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readlist-data
  namespace: personal-services
  labels:
    # 备份归属:必须同时登记进夜备脚本的 sqlite 列表(规则 H4)。
    # 卷上有不可再生数据:evidence(重建要烧 2–3 天配额)、publisher_map、
    # overrides、title_whitelist —— 全是人工投入或昂贵缓存(NFR-16)。
    backup.homelab/sqlite: "true"
  annotations:
    # ArgoCD 护栏:PVC 绝不能被 prune 掉。
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# 单副本 + Recreate:SQLite 是单写锁,滚动更新会让新旧 pod 抢同一个 db 文件(NFR-6)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readlist
  namespace: personal-services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: readlist }
  template:
    metadata:
      labels: { app: readlist, readlist.role: web }
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: readlist
          image: ghcr.io/meirongdev/readlist:v0.1.0 # ← 换成 CI 推出的 tag/digest
          command: ["readlist", "serve"]
          envFrom: [{ configMapRef: { name: readlist-config } }]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        # ⚠️ Web pod **永不挂 calibre 的任何卷**。公开应用的任何 bug 都碰不到书库,
        # 也碰不到 app.db 里的凭据(architecture §2 的 blast radius 论证)。
        - name: data
          persistentVolumeClaim: { claimName: readlist-data }
---
apiVersion: v1
kind: Service
metadata:
  name: readlist
  namespace: personal-services
spec:
  type: ClusterIP
  selector: { app: readlist }
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 域名 readlist.meirong.dev —— **不用 books.**:与私有书库 book.meirong.dev
# 只差一个字母,误配代价太高(architecture §6)。
# 通配隧道 + external-dns 会自动建记录,不需要改 DNS/隧道配置。
# ReferenceGrant 不需要:该集群的 gateway 清单已有覆盖本命名空间的通配授权。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: readlist
  namespace: personal-services
spec:
  parentRefs:
    - name: cilium-gateway # ← 对齐 homelab 侧实际的 Gateway 名
      namespace: gateway
  hostnames: ["readlist.meirong.dev"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs:
        - name: readlist
          port: 80
---
# ── 快照:唯一接触 calibre 的工作负载 ──────────────────────────────────
# 几十行的短命 Job,无网络出口(见下面的 NetworkPolicy)。
# metadata.db 是 WAL,**必须 RW 挂载**:WAL 的读路径也要写 -shm,只读挂载会得到
# "attempt to write a readonly database"。readlist 只做 VACUUM INTO,不改书目。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-snapshot
  namespace: personal-services
spec:
  schedule: "5 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: readlist, readlist.role: snapshot }
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: snapshot
              image: ghcr.io/meirongdev/readlist:v0.1.0
              command: ["readlist", "snapshot"]
              envFrom: [{ configMapRef: { name: readlist-config } }]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: library, mountPath: /library-src }
                - { name: config, mountPath: /config-src, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: readlist-data }
            # RWO 在单节点集群上可以被多个 pod 挂载 —— RWO 是**节点级**语义,
            # calibre-web 自己的清单已有同样论证。
            - name: library
              persistentVolumeClaim: { claimName: calibre-books-local }
            # ☠️ app.db 含密码 hash / 会话 / OIDC 凭据 → 只读挂载,
            # 且 readlist 只导出 3 张表的少数几列(NFR-13)。
            - name: config
              persistentVolumeClaim: { claimName: calibre-web-automated-config-local }
---
# 快照作业**没有任何网络出口**:能碰书库的这个容器,连不出去。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readlist-snapshot-no-egress
  namespace: personal-services
spec:
  podSelector:
    matchLabels: { readlist.role: snapshot }
  policyTypes: ["Egress"]
  egress: [] # 空 = 全部拒绝
---
# ── 摄入外部证据:唯一需要出网的工作负载 ───────────────────────────────
# 与 snapshot 分开,正是为了让"碰书库"和"能出网"这两件事永不出现在同一个 pod 里。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-ingest
  namespace: personal-services
spec:
  schedule: "20 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1 # 配额受限,失败别急着重试
      template:
        metadata:
          labels: { app: readlist, readlist.role: ingest }
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: ingest
              image: ghcr.io/meirongdev/readlist:v0.1.0
              command: ["readlist", "ingest"]
              envFrom: [{ configMapRef: { name: readlist-config } }]
              env:
                # 可选但**强烈建议**:Google Books 的匿名配额是按共享项目计的,
                # 实测从家宽/云出口发一次请求就可能直接拿到 429。
                - name: GOOGLE_BOOKS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: readlist-secrets
                      key: google-books-key
                      optional: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: readlist-data }
---
# ── 重算评分:纯离线(score 命令禁止发起网络请求,system-design §9)──────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-score
  namespace: personal-services
spec:
  schedule: "40 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: readlist, readlist.role: score }
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: score
              image: ghcr.io/meirongdev/readlist:v0.1.0
              command: ["readlist", "score"]
              envFrom: [{ configMapRef: { name: readlist-config } }]
              resources:
                requests: { cpu: 100m, memory: 96Mi }
                limits: { cpu: 1, memory: 384Mi }
              volumeMounts:
                - { name: data, mountPath: /data }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: readlist-data }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readlist-score-no-egress
  namespace: personal-services
spec:
  podSelector:
    matchLabels: { readlist.role: score }
  policyTypes: ["Egress"]
  egress: []
