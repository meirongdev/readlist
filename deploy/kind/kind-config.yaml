# kind 单节点集群(本地端到端验证用)。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: readlist
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
