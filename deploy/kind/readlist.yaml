apiVersion: v1
kind: Namespace
metadata:
  name: readlist
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readlist-config
  namespace: readlist
data:
  DB_PATH: /data/readlist.db
  API_LISTEN_ADDR: ":8080"
  EXPOSE_READ_STATUS: "true"
  STANDARD_VERSION: "1.0"
  # 保留的历史 run 数(回滚窗口)。每夜一个 run 的产物约 1.5 万行,不回收会在
  # 几个月内把 100Mi 的 PVC 写满。
  KEEP_RUNS: "5"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readlist-data
  namespace: readlist
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
# 单副本 + Recreate(SQLite 单写锁;滚动更新会抢锁)—— architecture.md NFR-6
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readlist
  namespace: readlist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: readlist }
  template:
    metadata:
      labels: { app: readlist }
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        # 建库 + 保证有一份可服务的榜单;distroless 无 shell,直接调用 readlist init。
        # `init` 是幂等的:已发布过 run 就跳过打分。无条件重打分会让每次 Pod 重启
        # 都换一个 run_id,内容 ETag 随之全部失效。
        - name: init-data
          image: readlist:dev
          imagePullPolicy: IfNotPresent
          command: ["readlist", "init"]
          envFrom: [{ configMapRef: { name: readlist-config } }]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: readlist
          image: readlist:dev
          imagePullPolicy: IfNotPresent
          command: ["readlist", "serve"]
          envFrom: [{ configMapRef: { name: readlist-config } }]
          ports: [{ containerPort: 8080 }]
          # 就绪探针查库(「现在能不能提供内容」),存活探针**不查库**。
          # 让 liveness 也查库,等于在高负载时主动杀掉唯一副本 —— 而 SQLite 单写锁下
          # 这个副本不可替代。两个探针都显式给 timeoutSeconds(默认只有 1 秒)。
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: readlist-data }
---
apiVersion: v1
kind: Service
metadata:
  name: readlist
  namespace: readlist
spec:
  type: NodePort
  selector: { app: readlist }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
# 每夜重算评分(system-design §1 原子发布由 published_run 指针承担)。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: readlist-score
  namespace: readlist
spec:
  schedule: "17 1 * * *"
  timeZone: Etc/UTC # 与 readlist 内部一律用 UTC 的口径对齐,节点时区变了也不漂移
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: score
              image: readlist:dev
              imagePullPolicy: IfNotPresent
              command: ["readlist", "score"]
              envFrom: [{ configMapRef: { name: readlist-config } }]
              volumeMounts: [{ name: data, mountPath: /data }]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: readlist-data }
