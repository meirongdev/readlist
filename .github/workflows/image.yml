name: image

# 推版本化 tag 才发布镜像。
#
# 两条集群约束(architecture §6):
#   - 镜像**必须含 linux/arm64**(oracle-k3s 是 ARM free tier);
#   - Kyverno **禁止 `latest`**,所以这里刻意关掉 metadata-action 的 latest flavor。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布用的版本号(如 v0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  push:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # make 的目标带 GOPROXY=off,所以依赖要先显式拉下来(同 ci.yml 的说明)。
      - name: 下载依赖
        run: go mod download

      # 先跑测试再推镜像:推出去的东西不该没过门禁。
      - name: 门禁(go test)
        run: make test-go

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=false:集群的 Kyverno 策略会拒掉 latest tag 的工作负载。
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long,prefix=sha-

      - name: 构建并推送(amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号编进二进制,/healthz 据此报出正在运行的是哪个镜像。
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出可直接写进清单的不可变引用
        run: |
          echo "### 镜像已发布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "把上面的 tag 或 digest 填进 homelab 仓库的 readlist.yaml。" >> "$GITHUB_STEP_SUMMARY"

  # release note 的正文**就是 annotated tag 的正文** —— 不另起一份 CHANGELOG,
  # 免得两处同源文本迟早对不上(同 SPA 那条「一个公式只留一份」的理由)。
  # 打 tag 时把话写清楚,这里只负责搬运,外加追加一段镜像引用。
  #
  # 跑在 push 之后:门禁没过、镜像没推出去,就不该有一个 release 页面在那儿
  # 宣称这一版可用。
  release:
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 会把所有 tag 对象拉全 —— 默认的浅克隆只给出 tag 指向的
      # commit,拿不到 annotated tag 自身的正文。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 tag 正文生成 release note
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TAGS: ${{ needs.push.outputs.tags }}
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          set -euo pipefail

          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG 不是 annotated tag,没有正文可用作 release note。" \
                 "请用 git tag -a $TAG 重新打,正文写明本版改了什么、有没有 BREAKING CHANGE。"
            exit 1
          fi

          title="$(git tag -l --format='%(contents:subject)' "$TAG")"
          {
            git tag -l --format='%(contents:body)' "$TAG"
            echo
            echo '## 镜像'
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
            echo
            echo '部署:把上面的 tag 或 digest 填进 [homelab](https://github.com/meirongdev/homelab) 的 `cloud/oracle/manifests/readlist.yaml`。'
          } > notes.md

          # workflow_dispatch 重跑同一个 tag 时走 edit,否则 create 会因已存在而失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag
          fi
