name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 必须显式下载:make 的目标一律带 GOPROXY=off(用来证明构建过程不外联),
      # 而 setup-go 的 cache 只负责恢复/保存缓存、不会拉依赖 —— 缓存为空时
      # (首次运行、go.sum 变更后)GOPROXY=off 会直接报 module lookup disabled。
      - name: 下载依赖(这一步是唯一允许联网的)
        run: go mod download

      - name: 校验依赖完整性
        run: go mod verify

      - name: fmt + vet + go test
        run: make check

      - name: 竞态检测
        run: make test-race

  build-image:
    # 只验证镜像能构出来(含交叉编译),不推送 —— 推送归 image.yml。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建 linux/arm64(集群是 ARM free tier,NFR-5)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
